<style>
:root{
  --paper:#E6ECE8; --sheet:#F7F9F7; --ink:#1F2B3D; --muted:#5D6A78; --line:#C9D3CE;
  --lacquer:#A3322A; --brass:#B88A1B; --brass-soft:#F3E3B5; --jade:#2F6B5A; --grey:#8A949C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141B24; --sheet:#1C2532; --ink:#E4E8EC; --muted:#9AA6B2; --line:#2E3A48;
    --lacquer:#E06A5E; --brass:#E2B54A; --brass-soft:#3A3120; --jade:#5FB39A; --grey:#6B7682;
  }
}
:root[data-theme="dark"]{
  --paper:#141B24; --sheet:#1C2532; --ink:#E4E8EC; --muted:#9AA6B2; --line:#2E3A48;
  --lacquer:#E06A5E; --brass:#E2B54A; --brass-soft:#3A3120; --jade:#5FB39A; --grey:#6B7682;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6;font-size:16px}
.serif{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

header{padding:18px 0 6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.5rem;letter-spacing:.12em}
.datenav{display:flex;align-items:center;gap:6px}
.datenav button{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:6px 12px;cursor:pointer}
.datenav input{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:5px 8px}
.pillars{margin:10px 0 0;color:var(--muted);font-size:.92rem}
.pillars b{color:var(--ink);font-weight:700}

/* the board: hero */
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:22px;margin-top:14px;align-items:start}
@media (max-width:880px){.main{grid-template-columns:1fr}}
.boardcard{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:16px}
.boardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.boardhead .hr{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.6rem;letter-spacing:.06em}
.boardhead .meta{color:var(--muted);font-size:.85rem}
.compass{position:relative;padding:22px}
.compass .cd{position:absolute;font-family:"Noto Serif TC",serif;font-weight:700;color:var(--muted);font-size:.85rem}
.cd.n{bottom:0;left:50%;transform:translateX(-50%)} .cd.s{top:0;left:50%;transform:translateX(-50%)}
.cd.e{left:0;top:50%;transform:translateY(-50%)} .cd.w{right:0;top:50%;transform:translateY(-50%)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--line);border:6px solid var(--line);border-radius:12px}
.pal{background:var(--sheet);border:0;border-radius:6px;text-align:left;padding:8px 9px 9px;min-height:132px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:1px;font-size:.84rem;line-height:1.45}
.pal .dir{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1rem;display:flex;justify-content:space-between;align-items:baseline}
.pal .dir small{font-weight:500;color:var(--muted);font-size:.75rem}
.pal .stem{font-family:"Noto Serif TC",serif;font-size:1.05rem}
.pal .door{font-weight:700}
.pal .door.good{color:var(--jade)} .pal .door.bad{color:var(--lacquer)}
.pal .god{color:var(--muted)}
.pal[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.pal.best{background:var(--brass-soft)}
.pal.zj::after{content:"最吉";position:absolute;right:6px;bottom:6px;background:var(--brass);color:#fff;font-size:.7rem;font-weight:700;padding:0 7px;border-radius:999px}
.pal.center{cursor:default;align-items:center;justify-content:center;text-align:center;color:var(--muted)}
.pal.center .stem{color:var(--ink)}
@media (max-width:420px){.pal{min-height:118px;padding:6px;font-size:.76rem}.pal .dir{font-size:.9rem}.compass{padding:20px 18px}}

/* hour strip */
.hours{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:14px}
.hb{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:6px 2px 5px;cursor:pointer;text-align:center;line-height:1.25;position:relative}
.hb .z{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.05rem}
.hb .t{font-size:.68rem;color:var(--muted)}
.hb .s{font-size:.72rem;font-weight:700}
.hb[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.hb[aria-pressed="true"] .t{color:inherit;opacity:.8}
.hb.has::before{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--brass)}
.hb.now{border-color:var(--lacquer);border-width:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.78rem;margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brass);margin-right:5px;vertical-align:1px}
.legend em{font-style:normal;display:inline-block;width:12px;height:10px;border:2px solid var(--lacquer);border-radius:3px;margin-right:5px;vertical-align:-1px}

/* side */
.side h2{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.15rem;margin:0 0 8px;letter-spacing:.04em}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}
.toprank{list-style:none;margin:0;padding:0}
.toprank li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.toprank li:last-child{border-bottom:0}
.toprank .rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-weight:700;font-size:.85rem}
.toprank li:first-child .rk{background:var(--brass);color:#fff}
.toprank .w{font-weight:700}
.toprank .w span{font-weight:400;color:var(--muted);font-size:.85rem}
.toprank .sc{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.15rem;color:var(--lacquer)}
.toggle{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin:0 0 6px}
.empty{color:var(--muted);font-size:.92rem;margin:4px 0}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0 0;font-size:.9rem}
.detail dt{font-weight:700} .detail dd{margin:0;color:var(--muted)}
.chk{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chk span{font-size:.76rem;padding:2px 9px;border-radius:999px;background:var(--paper)}
.chk span.x{color:var(--lacquer);background:transparent;border:1px solid var(--lacquer)}
.verdict{font-weight:700;margin:2px 0 0}
.verdict.ok{color:var(--brass)}

.go{background:var(--ink);color:var(--sheet);border-radius:18px;padding:16px;margin-bottom:18px}
.go h2{color:inherit}
.go .tgt{font-family:"Noto Serif TC",serif;font-weight:900;font-size:1.25rem;margin:0 0 4px}
.go .sub{opacity:.8;font-size:.85rem;margin:0 0 10px}
.go .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.go .dist button{border:1px solid rgba(255,255,255,.35);background:transparent;color:inherit;border-radius:999px;padding:3px 12px;cursor:pointer;font-size:.85rem}
.go .dist button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#fff}
.go .btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-size:.92rem}
.go .btn.loc{background:var(--brass);color:#fff}
.go .btn.map{background:var(--sheet);color:var(--ink)}
.go .btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.go .status{font-size:.82rem;opacity:.85;margin:6px 0 0;min-height:1.2em}
.go .compassbox{display:none;align-items:center;gap:14px;margin-top:10px}
.go .compassbox.on{display:flex}
.go .dial{width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.35);position:relative;flex:none}
.go .dial svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .15s linear}
.go .dial .nmark{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:.65rem;opacity:.7}
.go .ctext{font-size:.85rem;opacity:.9}
footer{color:var(--muted);font-size:.8rem;padding:6px 0 30px}
@media (prefers-reduced-motion:no-preference){.pal{transition:background .2s}}
</style>
</head>
<body>
<header class="wrap">
  <div class="bar">
    <h1>奇門擇吉</h1>
    <div class="datenav">
      <button id="prev" aria-label="前一天">‹</button>
      <input type="date" id="date" aria-label="選擇日期">
      <button id="next" aria-label="後一天">›</button>
      <button id="today">今天</button>
    </div>
  </div>
  <p class="pillars" id="pillars"></p>
</header>

<main class="wrap main">
  <section class="boardcard" aria-label="時盤">
    <div class="boardhead"><div class="hr" id="hrTitle"></div><div class="meta" id="hrMeta"></div></div>
    <div class="compass">
      <span class="cd s">南</span><span class="cd n">北</span><span class="cd e">東</span><span class="cd w">西</span>
      <div class="board" id="board"></div>
    </div>
    <div class="hours" id="hours" role="group" aria-label="選擇時辰"></div>
    <div class="legend"><span><i></i>有最吉方的時辰</span><span><em></em>現在時辰</span><span>數字為吉度分數</span></div>
  </section>

  <aside class="side">
    <div class="panel">
      <h2>今日最吉排行</h2>
      <label class="toggle"><input type="checkbox" id="dayOnly"> 只看日間（07:00–21:00）</label>
      <ol class="toprank" id="rank"></ol>
    </div>
    <div class="go" id="go">
      <h2>前往吉方</h2>
      <p class="tgt" id="goTgt"></p>
      <p class="sub" id="goSub"></p>
      <div class="row dist" id="dist" role="group" aria-label="導航距離">
        <span style="font-size:.85rem;opacity:.8">往該方向走</span>
        <button data-m="300">300 公尺</button><button data-m="1000">1 公里</button><button data-m="3000">3 公里</button>
      </div>
      <div class="row">
        <button class="btn loc" id="locBtn">定位目前位置</button>
        <a class="btn map" id="gmap" target="_blank" rel="noopener" aria-disabled="true">Google 地圖</a>
        <a class="btn map" id="amap" target="_blank" rel="noopener" aria-disabled="true">Apple 地圖</a>
      </div>
      <p class="status" id="locStatus">按「定位目前位置」後，會以你現在的位置為起點，規劃往吉方的路線。</p>
      <div class="compassbox" id="compassBox">
        <div class="dial"><span class="nmark">前</span><svg id="arrow" viewBox="0 0 84 84" aria-hidden="true"><path d="M42 10 L52 44 L42 38 L32 44 Z" fill="#E2B54A"/><circle cx="42" cy="42" r="3" fill="#fff"/></svg></div>
        <div class="ctext" id="ctext"></div>
      </div>
      <div class="row"><button class="btn map" id="cmpBtn" style="font-weight:500">啟用指南針箭頭</button></div>
    </div>
    <div class="panel detail" id="detail"></div>
  </aside>
</main>
<footer class="wrap">陽盤時家奇門，轉盤、置閏法排盤。最吉方條件：休、生、開、景門，且無門伏吟、門反吟、擊刑、白虎、空亡、門迫、門制、五不遇。內容為傳統術數參考。</footer>

<script>

const GOD=['值符','螣蛇','太陰','六合','白虎','玄武','九地','九天'];

function renderBoard(){
  const c=S.charts[S.hb],byP={};c.pals.forEach(x=>byP[x.p]=x);
  const topZ=c.zuiji[0];
  if(S.p==null||!byP[S.p])S.p=(topZ||c.best).p;
  $('#hrTitle').textContent=`${c.hourGZ}時　${hrTxt(S.hb)}`;
  $('#hrMeta').textContent=`旬首${c.xun}・空亡${c.kong}・值符${c.zhiFu}・值使${c.zhiShi}${c.wbu?'・五不遇時':''}`;
  $('#board').innerHTML=ORDER.map(p=>{if(p===5)return `<div class="pal center"><div>中宮</div><div class="stem">${c.di[5]}</div></div>`;
    const x=byP[p],dr=x.door;
    return `<button class="pal ${x.zj?'zj':''} ${topZ&&topZ.p===p?'best':''}" data-p="${p}" aria-pressed="${S.p===p}" aria-label="${x.dir}方，${x.door}，${x.star}，${x.god}${x.zj?'，最吉方':''}">
      <span class="dir">${x.dir}<small>${x.gua}</small></span>
      <span class="stem">${x.t}／${x.d}</span>
      <span>${x.star.replace('（禽）','禽')}</span>
      <span class="door ${'休生開'.includes(dr[0])?'good':'死驚傷'.includes(dr[0])?'bad':''}">${dr}</span>
      <span class="god">${x.god}</span></button>`}).join('');
  renderDetail();
}
function renderDetail(){
  const c=S.charts[S.hb],x=c.pals.find(q=>q.p===S.p),f=why(c,x),dr=x.door[0];
  const doorOk='休生開景'.includes(dr);
  let verdict;
  if(x.zj)verdict=`<p class="verdict ok">${x.dir}方是最吉方，八項條件全部通過。</p>`;
  else if(c.wbu)verdict=`<p class="verdict">此時辰為五不遇時，整個時辰不取最吉方。</p>`;
  else if(!doorOk)verdict=`<p class="verdict">${x.door}不在休、生、開、景四門之內。</p>`;
  else verdict=`<p class="verdict">${x.dir}方有凶格，未列入最吉。</p>`;
  const ge=x.ge.filter(g=>g!=='天輔時'||true);
  $('#detail').innerHTML=`<h2>${c.hourGZ}時・${x.dir}方（${x.gua}宮）</h2>${verdict}
    <div class="chk">${CHECKS.map(([k,t])=>`<span class="${f[k]?'x':''}" title="${t}">${f[k]?'有':'無'}${k}</span>`).join('')}<span class="${c.wbu?'x':''}">${c.wbu?'是':'非'}五不遇</span></div>
    ${ge.length?`<dl>${ge.map(g=>`<dt>${g}</dt><dd>${QM.GEDESC[g]||''}</dd>`).join('')}</dl>`:'<p class="empty" style="margin-top:10px">此宮沒有成格。</p>'}
    <p class="empty" style="margin-top:10px">吉度 ${Math.round(x.ss)} 分・${x.star}・${x.god}・天盤${x.t}／地盤${x.d}</p>`;
  if(typeof renderGo==='function')renderGo();
}
function setDate(s){S.date=s;S.hb=null;S.p=null;render()}
function shift(n){const d=new Date(S.date+'T12:00');d.setDate(d.getDate()+n);setDate(iso(d))}
$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#today').onclick=()=>{const ns=nowSlot();S.date=ns.date;S.hb=ns.hb;S.p=null;render()};
$('#date').onchange=e=>{if(e.target.value)setDate(e.target.value)};
$('#hours').onclick=e=>{const b=e.target.closest('.hb');if(!b)return;S.hb=+b.dataset.hb;S.p=null;renderHours();renderBoard()};
$('#board').onclick=e=>{const b=e.target.closest('.pal[data-p]');if(!b)return;S.p=+b.dataset.p;renderBoard()};
const pick=li=>{S.hb=+li.dataset.hb;S.p=+li.dataset.p;renderHours();renderBoard();if(window.innerWidth<880)$('.boardcard').scrollIntoView({behavior:'smooth'})};
$('#rank').onclick=e=>{const li=e.target.closest('li[data-hb]');if(li)pick(li)};
$('#rank').onkeydown=e=>{if(e.key==='Enter'){const li=e.target.closest('li[data-hb]');if(li)pick(li)}};
$('#dayOnly').checked=S.dayOnly;
$('#dayOnly').onchange=e=>{S.dayOnly=e.target.checked;store.set('qm_dayOnly',S.dayOnly?'1':'0');const hb=S.hb,p=S.p;render();S.hb=hb;S.p=p};

// ===== 定位與導航 =====
const BEAR={北:0,東北:45,東:90,東南:135,南:180,西南:225,西:270,西北:315};
const G={pos:null,dist:+(store.get('qm_dist')||1000),heading:null};
function destPoint(lat,lng,brg,m){const R=6371000,d=m/R,t=brg*Math.PI/180,p1=lat*Math.PI/180,l1=lng*Math.PI/180;
  const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(t));
  const l2=l1+Math.atan2(Math.sin(t)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));
  return [p2*180/Math.PI,l2*180/Math.PI]}
const fmt6=n=>n.toFixed(6);
function curTarget(){if(!S.charts.length||!S.charts[S.hb])return null;const c=S.charts[S.hb];return {c,x:c.pals.find(q=>q.p===S.p)}}
function renderGo(){
  const t=curTarget();if(!t){$('#go').style.display='none';return}$('#go').style.display='';
  const {c,x}=t;
  $('#goTgt').textContent=`${c.hourGZ}時 往${x.dir}方（${x.door}）`;
  $('#goSub').textContent=`${hrTxt(S.hb)}${x.zj?'・最吉方':'・非最吉方，可在盤上改選'}，方位角約 ${BEAR[x.dir]}°`;
  document.querySelectorAll('#dist button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===G.dist));
  const g=$('#gmap'),a=$('#amap');
  if(G.pos){const [la,ln]=[G.pos.coords.latitude,G.pos.coords.longitude];const [la2,ln2]=destPoint(la,ln,BEAR[x.dir],G.dist);
    g.href=`https://www.google.com/maps/dir/?api=1&origin=${fmt6(la)},${fmt6(ln)}&destination=${fmt6(la2)},${fmt6(ln2)}&travelmode=walking`;
    a.href=`https://maps.apple.com/?saddr=${fmt6(la)},${fmt6(ln)}&daddr=${fmt6(la2)},${fmt6(ln2)}&dirflg=w`;
    g.setAttribute('aria-disabled','false');a.setAttribute('aria-disabled','false');
  }else{g.removeAttribute('href');a.removeAttribute('href');g.setAttribute('aria-disabled','true');a.setAttribute('aria-disabled','true')}
  updateArrow();
}
function locate(){
  if(!('geolocation' in navigator)){$('#locStatus').textContent='這個瀏覽器不支援定位，請改用手機瀏覽器開啟。';return}
  $('#locStatus').textContent='定位中…';
  navigator.geolocation.getCurrentPosition(p=>{G.pos=p;const t=new Date(p.timestamp);
      $('#locStatus').textContent=`已定位（誤差約 ${Math.round(p.coords.accuracy)} 公尺，${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}）。點地圖按鈕開始導航。`;
      $('#locBtn').textContent='重新定位';renderGo()},
    e=>{G.pos=null;renderGo();
      $('#locStatus').textContent=e.code===1?'無法取得位置：定位權限被拒絕。請在瀏覽器或手機設定中允許定位；iPhone 請到「設定 → 隱私權與安全性 → 定位服務 → Safari 網站」設為「使用 App 期間」。':e.code===3?'定位逾時，請到戶外或開啟 GPS 後再試一次。':'暫時無法取得位置，請稍後再試。'},
    {enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function updateArrow(){
  const t=curTarget();if(!t||G.heading==null)return;
  const rel=((BEAR[t.x.dir]-G.heading)%360+360)%360;
  $('#arrow').style.transform=`rotate(${rel}deg)`;
  $('#ctext').textContent=rel<15||rel>345?`就是這個方向，往${t.x.dir}方前進。`:`請${rel<=180?'向右':'向左'}轉約 ${Math.round(rel<=180?rel:360-rel)}°，箭頭指向${t.x.dir}方。`;
}
function onOrient(e){let h=null;
  if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;
  else if(e.absolute&&typeof e.alpha==='number')h=(360-e.alpha)%360;
  if(h==null)return;G.heading=h;$('#compassBox').classList.add('on');updateArrow()}
async function enableCompass(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){$('#locStatus').textContent='未允許使用指南針，可改用地圖導航。';return}}
    window.addEventListener('deviceorientationabsolute',onOrient);window.addEventListener('deviceorientation',onOrient);
    $('#cmpBtn').textContent='指南針已啟用';
    setTimeout(()=>{if(G.heading==null)$('#locStatus').textContent='這台裝置或瀏覽器沒有提供指南針資料，請改用地圖導航。'},2500);
  }catch(err){$('#locStatus').textContent='無法啟用指南針，請改用地圖導航。'}
}
$('#locBtn').onclick=locate;$('#cmpBtn').onclick=enableCompass;
$('#dist').onclick=e=>{const b=e.target.closest('button[data-m]');if(!b)return;G.dist=+b.dataset.m;store.set('qm_dist',String(G.dist));renderGo()};
try{navigator.permissions&&navigator.permissions.query({name:'geolocation'}).then(r=>{if(r.state==='granted')locate()}).catch(()=>{})}catch(e){}
const ns=nowSlot();S.date=ns.date;S.hb=ns.hb;render();
</script>
